<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANI HACKER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
  }
  /* Matrix rain canvas */
  #matrix { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.25; }

  #screen {
    position: relative;
    z-index: 1;
    height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }

  #topbar {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #0f0;
    padding-bottom: 8px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .blink { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #code {
    flex: 1;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-all;
    font-size: 15px;
    line-height: 1.3;
    text-shadow: 0 0 5px #0f0;
  }

  /* Loading overlay */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 25px;
  }
  #title {
    font-size: 42px;
    font-weight: bold;
    color: #0f0;
    text-shadow: 0 0 15px #0f0;
    letter-spacing: 6px;
  }
  #subtitle { color: #0a0; font-size: 14px; letter-spacing: 3px; }

  #startbtn {
    background: transparent;
    border: 2px solid #0f0;
    color: #0f0;
    font-family: inherit;
    font-size: 20px;
    padding: 12px 45px;
    cursor: pointer;
    letter-spacing: 3px;
    box-shadow: 0 0 15px #0f0 inset;
    transition: all .2s;
  }
  #startbtn:hover { background: #0f0; color: #000; }

  #loadbox { display: none; text-align: center; }
  #count { font-size: 90px; text-shadow: 0 0 25px #0f0; }
  #barouter {
    width: 320px; height: 22px;
    border: 1px solid #0f0;
    margin: 15px auto;
  }
  #bar { height: 100%; width: 0%; background: #0f0; box-shadow: 0 0 10px #0f0; }
  #loadtext { font-size: 13px; color: #0a0; min-height: 18px; }

  #granted {
    display: none;
    font-size: 46px;
    color: #0f0;
    text-shadow: 0 0 30px #0f0;
    letter-spacing: 8px;
    border: 3px solid #0f0;
    padding: 20px 40px;
    animation: pop .3s;
  }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  #warn {
    position: fixed;
    bottom: 8px; left: 0; right: 0;
    text-align: center;
    z-index: 2;
    font-size: 11px;
    color: #455;
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="overlay">
  <div id="title">SANI HACKER</div>
  <div id="subtitle">// PRANK TERMINAL — ENTERTAINMENT ONLY //</div>
  <button id="startbtn">START HACK</button>
  <div id="loadbox">
    <div id="count">5</div>
    <div id="barouter"><div id="bar"></div></div>
    <div id="loadtext"></div>
    <div id="granted">ACCESS GRANTED</div>
  </div>
</div>

<div id="screen">
  <div id="topbar">
    <span>root@sani:~# exploit --target=DEMO_LAB</span>
    <span class="blink">█</span>
  </div>
  <div id="code"></div>
</div>

<div id="warn">*** This is a fun prank simulator. No real system is accessed. ***</div>

<script>
/* ---------- Matrix rain ---------- */
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth; canvas.height = innerHeight;
const chars = 'アカサタナハマヤラワ0123456789ABCDEF#$%&';
const fontSize = 15;
const cols = canvas.width / fontSize;
const drops = Array(Math.floor(cols)).fill(1);
setInterval(() => {
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0f0';
  ctx.font = fontSize + 'px monospace';
  drops.forEach((y, i) => {
    ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, y * fontSize);
    if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  });
}, 50);

/* ---------- Fake code typing ---------- */
const fakeCode = `
[+] Establishing reverse shell on 10.0.0.${r(255)} ... OK
[+] Bypassing firewall rules via packet fragmentation
[+] Scanning ports: 22 OPEN | 80 OPEN | 443 OPEN | 8080 FILTERED
[+] Injecting payload -> /var/www/html/.hidden_shell.php
[+] Privilege escalation: CVE-DEMO-XXXXX kernel exploit
[+] root access obtained on node DEMO-LAB-01
[+] Dumping hashes... 42 entries recovered
[+] Cracking NTLM: aad3b435b51404ee -> ****DEMO****
[+] Deploying stealth persistence module
[+] Encrypting exfiltration channel AES-256
[+] Trace spoofed via 7 proxy hops
[+] Operation DEMO complete. All data is FAKE/SIMULATED.
$ sudo ./payload --mode=stealth --silent
Connecting to mainframe... handshake OK
Decrypting sectors: 0x4F 0x3A 0xB2 0xE1 ... done
Uploading ghost image of drive /dev/sda1 (simulated)
WARNING: SIMULATION MODE — nothing real is happening
`.trim();

const codeEl = document.getElementById('code');
let pos = 0, pause = 0;
document.addEventListener('keydown', () => {
  if (overlay.style.display !== 'none') return; // wait until started
  if (pause > 0) { pause--; return; }
  let chunk = 3;
  if (Math.random() < 0.03) pause = 12;               // random pause effect
  if (fakeCode[pos] === '\n') chunk = fakeCode.indexOf('\n', pos + 1) - pos; // line-by-line sometimes
  codeEl.textContent += fakeCode.slice(pos, pos + chunk) || '\n[+] Re-running simulation loop...\n';
  pos += chunk;
  if (pos >= fakeCode.length) pos = 0;
  codeEl.scrollTop = codeEl.scrollHeight;
});

function r(n) { return Math.floor(Math.random() * n); }

/* ---------- Start / loading sequence ---------- */
const overlay = document.getElementById('overlay');
const startbtn = document.getElementById('startbtn');
const loadbox = document.getElementById('loadbox');
const countEl = document.getElementById('count');
const bar = document.getElementById('bar');
const loadtext = document.getElementById('loadtext');
const granted = document.getElementById('granted');

const msgs = [
  'Bypassing security modules...',
  'Injecting demo payload...',
  'Cracking demo hash (fake)...',
  'Spoofing trace route...',
  'Finalizing simulation...'
];

startbtn.addEventListener('click', () => {
  startbtn.style.display = 'none';
  loadbox.style.display = 'block';
  let n = 5;
  countEl.textContent = n;
  const timer = setInterval(() => {
    n--;
    if (n > 0) {
      countEl.textContent = n;
      bar.style.width = ((5 - n) / 5 * 100) + '%';
      loadtext.textContent = msgs[5 - n - 1] || 'Loading...';
    } else {
      clearInterval(timer);
      countEl.style.display = 'none';
      bar.style.width = '100%';
      loadtext.style.display = 'none';
      granted.style.display = 'block';
      setTimeout(() => {
        overlay.style.display = 'none';
        codeEl.focusHint;
        document.getElementById('topbar').firstElementChild.textContent =
          'root@sani:~# session active — press any key to type';
      }, 1800);
    }
  }, 800);
});
</script>
</body>
</html>
